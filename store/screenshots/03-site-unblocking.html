<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../assets/store-style.css" />
    <title>PiP Anywhere - Unblocking</title>
  </head>
  <body>
    <main class="canvas">
      <section class="browser browser-large">
        <div class="browser-bar">
          <span class="dot"></span><span class="dot"></span
          ><span class="dot"></span>
          <span class="address">movie.example/player</span>
        </div>
        <div class="browser-body">
          <div class="video scene-blocked">
            <div class="blocked-panel">
              <span class="lock">!</span>
              <strong>Video-level PiP disabled</strong>
              <span
                >PiP Anywhere clears the block when browser policy allows.</span
              >
            </div>
            <div class="badge success floating-badge">block cleared</div>
            <div class="pip-button">
              <img src="../../src/assets/icon.svg" alt="" />
            </div>
            <div class="timeline"></div>
          </div>
        </div>
      </section>
      <section class="copy">
        <p class="eyebrow">Best-effort unblocking</p>
        <h1>Helps where sites block PiP</h1>
        <p>
          Helps on key streaming sites, including Netflix and Disney+, without
          claiming browser policy can always be bypassed.
        </p>
      </section>
    </main>
  </body>
</html>
