<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../assets/store-style.css" />
    <title>PiP Anywhere - Small Promo</title>
  </head>
  <body>
    <main class="promo small">
      <section class="promo-copy">
        <span class="mark"><img src="../../src/assets/icon.svg" alt="" /></span>
        <h1>PiP Anywhere</h1>
        <p>Better PiP controls. Open it your way.</p>
      </section>
      <section class="promo-device">
        <div class="promo-window">
          <div class="promo-bar"><span></span><span></span><span></span></div>
          <div class="promo-video">
            <div class="promo-video-tag">controls ready</div>
            <div class="promo-pip-button">
              <img src="../../src/assets/icon.svg" alt="" />
            </div>
            <div class="promo-timeline"></div>
          </div>
        </div>
        <div class="promo-pip">
          <span>Native PiP</span>
        </div>
      </section>
    </main>
  </body>
</html>
